<svg viewBox="0 0 800 550" xmlns="http://www.w3.org/2000/svg">
  <!-- White background -->
  <rect width="800" height="550" fill="white"/>
  
  <!-- Define styles -->
  <defs>
    <style>
      .word-text { font-family: Arial, sans-serif; font-size: 18px; fill: #333; }
      .label-text { font-family: Arial, sans-serif; font-size: 24px; fill: #333; }
      .box { fill: white; stroke: #333; stroke-width: 2; }
      .hidden-circle { fill: #e3f2fd; stroke: #1976d2; stroke-width: 2; }
      .hidden-text { font-family: Arial, sans-serif; font-size: 18px; fill: #1976d2; text-anchor: middle; dominant-baseline: middle; }
      .connection { stroke: #666; stroke-width: 1; fill: none; }
      .arrow { stroke: #666; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead); }
      .box-text { font-family: Arial, sans-serif; font-size: 16px; fill: #333; text-anchor: middle; dominant-baseline: middle; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#666" />
    </marker>
  </defs>
  
  <!-- Words (left side) -->
  <text x="50" y="105" class="word-text">bicycle</text>
  <text x="50" y="155" class="word-text">wheel</text>
  <text x="50" y="205" class="word-text">car</text>
  <text x="50" y="255" class="word-text">steer</text>
  <text x="50" y="305" class="word-text">ride</text>
  <text x="50" y="355" class="word-text">horse</text>
  <text x="50" y="405" class="word-text">grass</text>
  
  <!-- Input boxes (one-hot encoding) -->
  <rect x="140" y="85" width="40" height="30" class="box"/>
  <text x="160" y="105" class="box-text">0</text>
  
  <rect x="140" y="135" width="40" height="30" class="box"/>
  <text x="160" y="155" class="box-text">0</text>
  
  <rect x="140" y="185" width="40" height="30" class="box"/>
  <text x="160" y="205" class="box-text">0</text>
  
  <rect x="140" y="235" width="40" height="30" class="box"/>
  <text x="160" y="255" class="box-text">1</text>
  
  <rect x="140" y="285" width="40" height="30" class="box"/>
  <text x="160" y="305" class="box-text">1</text>
  
  <rect x="140" y="335" width="40" height="30" class="box"/>
  <text x="160" y="355" class="box-text">0</text>
  
  <rect x="140" y="385" width="40" height="30" class="box"/>
  <text x="160" y="405" class="box-text">0</text>
  
  <!-- Hidden layer circles -->
  <circle cx="350" cy="200" r="25" class="hidden-circle"/>
  <text x="350" y="200" class="hidden-text">H1</text>
  
  <circle cx="350" cy="260" r="25" class="hidden-circle"/>
  <text x="350" y="260" class="hidden-text">H2</text>
  
  <circle cx="350" cy="320" r="25" class="hidden-circle"/>
  <text x="350" y="320" class="hidden-text">H3</text>
  
  <!-- Connections from input to hidden layer -->
  <line x1="180" y1="100" x2="325" y2="200" class="connection"/>
  <line x1="180" y1="100" x2="325" y2="260" class="connection"/>
  <line x1="180" y1="100" x2="325" y2="320" class="connection"/>
  
  <line x1="180" y1="150" x2="325" y2="200" class="connection"/>
  <line x1="180" y1="150" x2="325" y2="260" class="connection"/>
  <line x1="180" y1="150" x2="325" y2="320" class="connection"/>
  
  <line x1="180" y1="200" x2="325" y2="200" class="connection"/>
  <line x1="180" y1="200" x2="325" y2="260" class="connection"/>
  <line x1="180" y1="200" x2="325" y2="320" class="connection"/>
  
  <line x1="180" y1="250" x2="325" y2="200" class="connection"/>
  <line x1="180" y1="250" x2="325" y2="260" class="connection"/>
  <line x1="180" y1="250" x2="325" y2="320" class="connection"/>
  
  <line x1="180" y1="300" x2="325" y2="200" class="connection"/>
  <line x1="180" y1="300" x2="325" y2="260" class="connection"/>
  <line x1="180" y1="300" x2="325" y2="320" class="connection"/>
  
  <line x1="180" y1="350" x2="325" y2="200" class="connection"/>
  <line x1="180" y1="350" x2="325" y2="260" class="connection"/>
  <line x1="180" y1="350" x2="325" y2="320" class="connection"/>
  
  <line x1="180" y1="400" x2="325" y2="200" class="connection"/>
  <line x1="180" y1="400" x2="325" y2="260" class="connection"/>
  <line x1="180" y1="400" x2="325" y2="320" class="connection"/>
  
  <!-- Softmax boxes -->
  <rect x="540" y="85" width="40" height="30" class="box"/>
  <text x="560" y="101" class="box-text">0.44</text>
  
  <rect x="540" y="135" width="40" height="30" class="box"/>
  <text x="560" y="151" class="box-text">0.12</text>
  
  <rect x="540" y="185" width="40" height="30" class="box"/>
  <text x="560" y="201" class="box-text">0.11</text>
  
  <rect x="540" y="235" width="40" height="30" class="box"/>
  <text x="560" y="251" class="box-text">0.05</text>
  
  <rect x="540" y="285" width="40" height="30" class="box"/>
  <text x="560" y="301" class="box-text">0.04</text>
  
  <rect x="540" y="335" width="40" height="30" class="box"/>
  <text x="560" y="351" class="box-text">0.15</text>
  
  <rect x="540" y="385" width="40" height="30" class="box"/>
  <text x="560" y="401" class="box-text">0.09</text>
  
  <!-- Connections from hidden to softmax -->
  <line x1="375" y1="200" x2="540" y2="100" class="connection"/>
  <line x1="375" y1="200" x2="540" y2="150" class="connection"/>
  <line x1="375" y1="200" x2="540" y2="200" class="connection"/>
  <line x1="375" y1="200" x2="540" y2="250" class="connection"/>
  <line x1="375" y1="200" x2="540" y2="300" class="connection"/>
  <line x1="375" y1="200" x2="540" y2="350" class="connection"/>
  <line x1="375" y1="200" x2="540" y2="400" class="connection"/>
  
  <line x1="375" y1="260" x2="540" y2="100" class="connection"/>
  <line x1="375" y1="260" x2="540" y2="150" class="connection"/>
  <line x1="375" y1="260" x2="540" y2="200" class="connection"/>
  <line x1="375" y1="260" x2="540" y2="250" class="connection"/>
  <line x1="375" y1="260" x2="540" y2="300" class="connection"/>
  <line x1="375" y1="260" x2="540" y2="350" class="connection"/>
  <line x1="375" y1="260" x2="540" y2="400" class="connection"/>
  
  <line x1="375" y1="320" x2="540" y2="100" class="connection"/>
  <line x1="375" y1="320" x2="540" y2="150" class="connection"/>
  <line x1="375" y1="320" x2="540" y2="200" class="connection"/>
  <line x1="375" y1="320" x2="540" y2="250" class="connection"/>
  <line x1="375" y1="320" x2="540" y2="300" class="connection"/>
  <line x1="375" y1="320" x2="540" y2="350" class="connection"/>
  <line x1="375" y1="320" x2="540" y2="400" class="connection"/>
  
  <!-- Output boxes -->
  <rect x="700" y="85" width="40" height="30" class="box"/>
  <text x="720" y="101" class="box-text">1</text>
  
  <rect x="700" y="135" width="40" height="30" class="box"/>
  <text x="720" y="151" class="box-text">0</text>
  
  <rect x="700" y="185" width="40" height="30" class="box"/>
  <text x="720" y="201" class="box-text">0</text>
  
  <rect x="700" y="235" width="40" height="30" class="box"/>
  <text x="720" y="251" class="box-text">0</text>
  
  <rect x="700" y="285" width="40" height="30" class="box"/>
  <text x="720" y="301" class="box-text">0</text>
  
  <rect x="700" y="335" width="40" height="30" class="box"/>
  <text x="720" y="351" class="box-text">0</text>
  
  <rect x="700" y="385" width="40" height="30" class="box"/>
  <text x="720" y="401" class="box-text">0</text>
  
  <!-- Connections from softmax to output (now arrows) -->
  <line x1="580" y1="100" x2="700" y2="100" class="arrow"/>
  <line x1="580" y1="150" x2="700" y2="150" class="arrow"/>
  <line x1="580" y1="200" x2="700" y2="200" class="arrow"/>
  <line x1="580" y1="250" x2="700" y2="250" class="arrow"/>
  <line x1="580" y1="300" x2="700" y2="300" class="arrow"/>
  <line x1="580" y1="350" x2="700" y2="350" class="arrow"/>
  <line x1="580" y1="400" x2="700" y2="400" class="arrow"/>

  <!-- Section labels -->
  <text x="350" y="40" text-anchor="middle" class="label-text">word2vec (Mikolov et al. 2013)</text>
    <text x="80" y="490" class="label-text">Input vector</text>
    <text x="160" y="450" class="label-text">Embedding weights</text>
    <text x="280" y="410" class="label-text">Hidden layer</text>
    <text x="420" y="450" class="label-text">Softmax</text>
    <text x="620" y="490" class="label-text">Output vector</text>

</svg>
